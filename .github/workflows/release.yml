name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege at the top; the release job opts into exactly what it needs.
permissions: {}

jobs:
  release:
    name: Version PR or publish
    runs-on: ubuntu-latest
    # `Release` is a protected environment — require manual approval before
    # a publish runs. Configure it in repo Settings → Environments.
    environment: Release
    permissions:
      contents: write # push the version bump + create git tags
      pull-requests: write # open / update the "Version Packages" PR
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Trusted publishing + automatic provenance require npm >= 11.5.1.
      - name: Pin npm with trusted-publishing support
        run: npm install -g npm@latest

      - name: Create Release PR or publish
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
