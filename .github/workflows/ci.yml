name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo; grant nothing by default.
permissions: {}

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # pnpm 11 requires Node >=22.13; pin to 10 so the Node 20 matrix
          # row still works. pnpm 10 reads the same lockfile-v9 generated
          # by local pnpm 11.x.
          version: 10

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typed lint (type-aware correctness)
        run: pnpm lint:types

      - name: Dead-code (knip)
        run: pnpm lint:knip

      - name: Build
        run: pnpm build

      - name: Typecheck (incl. *.spec.ts)
        run: pnpm typecheck

      - name: Test + coverage
        run: pnpm -r test:coverage
