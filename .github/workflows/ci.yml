name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo; grant nothing by default.
permissions: {}

# Opt JavaScript-based GitHub Actions onto Node.js 24 ahead of the
# 2026-06-02 default flip. Silences the deprecation warning attached to
# actions/checkout, actions/setup-node, and pnpm/action-setup on runs
# prior to that date.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # pnpm 11 requires Node >=22.13; pin to 10 so the Node 20 matrix
          # row still works. pnpm 10 reads the same lockfile-v9 generated
          # by local pnpm 11.x.
          version: 10

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typed lint (type-aware correctness)
        run: pnpm lint:types

      - name: Dead-code (knip)
        run: pnpm lint:knip

      - name: Build
        run: pnpm build

      - name: Typecheck (incl. *.spec.ts)
        run: pnpm typecheck

      - name: Test + coverage
        run: pnpm -r test:coverage
